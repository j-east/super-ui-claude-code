<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Rendered transcripts are model output: no remote images (tracking pixels), forms or plugins. -->
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data:; form-action 'none'; object-src 'none'; base-uri 'none'">
  <title>Claude Code Super UI</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" id="hljs-css" href="/vendor/hljs-dark.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="tabbar">
    <button id="side-btn" title="Show or hide the tab list (⌘B)">◧</button>
    <span id="bar-title"></span>
    <span class="spacer"></span>
    <button id="session-btn" title="Tools for the session you are looking at: reload it, hand off to a fresh one, or split it in two">↻ Session</button>
    <button id="steward-btn" title="The Steward: a Claude session that organises this workspace. It gathers tasks into lists, opens sessions with a brief and closes finished ones. It does not do the work itself.">✦ Steward</button>
    <button id="inbox-btn">☰ Inbox</button>
    <button id="reg-btn">◎ Registrar</button>
    <button id="split-btn" title="Split: show two tabs side by side (⌘\\). Or drag a tab onto the right half of the window.">◫ Split</button>
    <button id="ws-btn" title="Save or reopen this window's tabs (⌥⌘S / ⌥⌘O)">▤ Workspaces</button>
    <select id="theme" title="Theme"></select>
  </header>
  <div id="main">
    <aside id="sidebar">
      <div id="side-top">
        <button id="new-tab" title="New tab in the same folder (Ctrl+Shift+T)"><span class="nt-plus">+</span><span class="nt-text"> New tab</span></button>
        <button id="tidy-btn" title="Look over the open tabs and close the ones that are finished">Tidy tabs…</button>
      </div>
      <div id="tabs"></div>
      <div id="later"></div>
    </aside>
    <div id="side-grip" title="Drag to resize the tab list. Double-click to reset."></div>
    <div id="panes">
      <div id="no-tabs" hidden>No tabs open. <button id="no-tabs-new">New tab</button></div>
    </div>
  </div>
  <div id="toast" hidden></div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/vendor/hljs.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
