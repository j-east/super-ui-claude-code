<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Rendered transcripts are model output: no remote images (tracking pixels), forms or plugins. -->
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data:; form-action 'none'; object-src 'none'; base-uri 'none'">
  <title>Claude Code Super UI</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" id="hljs-css" href="/vendor/hljs-dark.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="tabbar">
    <div id="tabs"></div>
    <button id="new-tab" title="New tab in the same folder (Ctrl+Shift+T)">+</button>
    <span class="spacer"></span>
    <button id="split-btn" title="Split: show two tabs side by side (⌘\\). Or drag a tab onto the right half of the window.">◫ Split</button>
    <button id="ws-btn" title="Save or reopen this window's tabs (⌥⌘S / ⌥⌘O)">▤ Workspaces</button>
    <select id="theme" title="Theme"></select>
  </header>
  <div id="panes">
    <div id="no-tabs" hidden>No tabs open. <button id="no-tabs-new">New tab</button></div>
  </div>
  <div id="toast" hidden></div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/vendor/hljs.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
